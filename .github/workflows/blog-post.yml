name: تازه‌ترین نوشته‌ها

# هر شش ساعت (و با دکمه‌ی دستی) آخرین مقاله‌های سایت را از RSS می‌خواند و در README می‌گذارد.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://mohsenhashempour.ir/rss.xml"
          max_post_count: 5
          template: "- [$title]($url) — $date"
          date_format: "yyyy/mm/dd"
          commit_message: "به‌روزرسانی خودکار نوشته‌ها"
